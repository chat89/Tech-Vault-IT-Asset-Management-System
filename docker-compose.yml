services:
  postgres:
    image: postgres:16-alpine
    container_name: techvault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: techvault
      POSTGRES_PASSWORD: techvault_password
      POSTGRES_DB: techvault_db
    ports:
      - "5432:5432"
    volumes:
      - techvault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techvault -d techvault_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: techvault_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://techvault:techvault_password@postgres:5432/techvault_db?sslmode=disable
      JWT_SECRET: super_secure_jwt_secret_techvault_enterprise_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: techvault_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  techvault_pgdata:

